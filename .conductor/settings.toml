"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
run_mode = "concurrent"

# Static site: no build step. Serve the workspace root on this workspace's port.
[scripts.run.serve]
available_in = [ "local" ]
command = "python3 -m http.server \"$CONDUCTOR_PORT\" --bind 127.0.0.1"
default = true
icon = "globe"
